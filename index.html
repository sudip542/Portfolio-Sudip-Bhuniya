    <!-- Theme Initialization Script (Prevents Flickering) -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('portfolio-theme') || 'theme-light-blue';
          document.documentElement.classList.add(theme);
          if (theme === 'theme-dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('theme-light-blue');
        }
      })();
    </script>
